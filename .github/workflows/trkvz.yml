name: Stream Auto Update (Self-Hosted)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-streams:
    runs-on: self-hosted # İşi doğrudan kendi VPS'inizde çalıştırır

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Python Betiğini Çalıştır
        run: |
          python3 -m pip install -q requests
          python3 trkvz.py

      - name: Değişiklikleri Push Et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto update via Self-Hosted Runner [skip ci]" || echo "Değişiklik yok"
          git push origin main
