name: Update Turkuvaz Playlist

on:
  schedule:
    - cron: '0 */2 * * *' # Her 2 saatte bir otomatik çalışır
  workflow_dispatch:      # Manuel olarak da tetiklenebilir

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright curl-cffi
          playwright install chromium
          playwright install-deps chromium

      - name: Run Python Script
        run: python trkvz.py

      - name: Commit and push changes if playlist updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staging --quiet || (git commit -m "Auto-update playlist.m3u [skip ci]" && git push)
