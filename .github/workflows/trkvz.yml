name: Turkuvaz Stream Update

on:
  schedule:
    - cron: '0 * * * *'  # Her saat başı çalışır
  workflow_dispatch:      # Manuel tetikleme butonu

jobs:
  update-streams:
    runs-on: self-hosted # Doğrudan VPS üzerindeki runner çalıştırır

    steps:
      - name: Repoyu Çek ve Güncelle
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # En hızlı klonlama/güncelleme ayarı

      - name: Python Betiğini Çalıştır
        run: |
          python3 trkvz.py

      - name: Değişiklikleri Git'e Push Et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto update streams via Self-Hosted [skip ci]" || echo "Değişiklik yok"
          git push origin main
