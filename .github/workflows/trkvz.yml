name: Secure Token API Source Updater

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Betiği Çalıştır
        run: python trkvz.py

      - name: Oluşan Dosyayı Logla (Kontrol Amaçlı)
        run: cat trkvz-tokens.txt

      - name: Değişiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trkvz-tokens.txt
          git commit -m "Auto update tokens.txt [skip ci]"
          git push
