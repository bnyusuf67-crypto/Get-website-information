name: Secure Token Source Updater

on:
  schedule:
    # Her saat başı otomatik çalışır
    - cron: '0 * * * *'
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      # GitHub Actions IP engellerini ve 403 Forbidden hatalarını aşmak için WARP tüneli başlatır
      - name: Cloudflare WARP Kur
        uses: fscarmen/warp-on-actions@v1

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Betiği Çalıştır
        run: python trkvz.py

      - name: Değişiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Auto update tokens and playlist [skip ci]" || echo "Commit edilecek değişiklik yok."
          git push
