name: Secure Token Source Updater

on:
  schedule:
    - cron: '0 * * * *'  # Her saat başı otomatik çalışır
  workflow_dispatch:      # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  run-script:
    runs-on: self-hosted

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install curl-cffi

      - name: Betiği Çalıştır
        run: python trkvz.py

      - name: Değişiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Auto update tokenized m3u8 playlist via curl-cffi [skip ci]" || echo "Değişiklik yok"
          git push origin main
