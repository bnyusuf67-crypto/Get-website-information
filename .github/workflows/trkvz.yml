name: Secure Token Source Updater

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: self-hosted

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Bağımlılıklarını Yükle
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Betiği Çalıştır
        run: python3 trkvz.py

      - name: Değişiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto update tokens and playlist [skip ci]" || echo "Commit edilecek değişiklik yok."
          git push
